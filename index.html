<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>School Blog</h1>
    </header>
    <main>
        <article class="blog-post">
            <h2>BLABLA Title</h2>
            <p class="publish-date">Published on October 26, 2023</p>
            <p>blablabla</p>
            <p>blablabla</p>
            <p>blablabla</p>
            <p>blablabla</p>
            <div class="slideshow-container">
                <img src="https://via.placeholder.com/600x400/FF0000/FFFFFF?Text=Image1" class="slide active-slide" alt="Image 1">
                <img src="https://via.placeholder.com/600x400/0000FF/FFFFFF?Text=Image2" class="slide" alt="Image 2">
                <a class="prev">&#10094;</a>
                <a class="next">&#10095;</a>
            </div>
            <div class="comments-section">
                <h3>Comments</h3>
                <textarea id="comment-text" aria-label="Leave a comment"></textarea>
                <button id="submit-comment-button">Submit Comment</button>
            </div>
        </article>
    </main>
    <footer>
        <p>© 2023 School Name</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
